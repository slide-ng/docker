# Builds the image to check that it builds and starts. It does not push anything.
# To publish, see "Publishing the image" in the README.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      slide_ng_source:
        description: "SLIDE_NG_SOURCE: an npm name such as @slide-ng/core@2.0.0. Leave empty to pack the slide.ng repository."
        required: false

permissions:
  contents: read

env:
  # Where the slide.ng source comes from until it is on npm. Change it to the real repository.
  SLIDE_NG_REPO: slide-ng/slide.ng

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: shellcheck
        run: shellcheck -x entrypoint.sh tests/*.sh .githooks/commit-msg
      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - name: Entrypoint tests (no Docker, fake slide-ng)
        run: bash tests/entrypoint.test.sh
      - name: Commit message hook test
        run: bash tests/commit-msg.test.sh

  image:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      # Option A: a published package, from the manual run's input or the repository variable SLIDE_NG_SOURCE.
      # Option B (default): check out slide.ng and pack it. For a private repository add `token: ${{ secrets.SLIDE_NG_READ_TOKEN }}`.
      - name: Choose where slide.ng comes from
        id: source
        env:
          INPUT: ${{ github.event.inputs.slide_ng_source }}
          VARIABLE: ${{ vars.SLIDE_NG_SOURCE }}
        run: |
          if [ -n "${INPUT:-}" ]; then echo "spec=${INPUT}" >> "$GITHUB_OUTPUT"
          elif [ -n "${VARIABLE:-}" ]; then echo "spec=${VARIABLE}" >> "$GITHUB_OUTPUT"
          else echo "pack=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.source.outputs.pack == 'true'
        with:
          repository: ${{ env.SLIDE_NG_REPO }}
          path: slide.ng
      - uses: actions/setup-node@v4
        if: steps.source.outputs.pack == 'true'
        with:
          node-version: 22
      - name: Pack slide.ng
        if: steps.source.outputs.pack == 'true'
        run: |
          npm pack ./slide.ng --ignore-scripts --pack-destination packages
          echo "SLIDE_NG_SOURCE=packages/$(ls packages | grep '\.tgz$' | head -n 1)" >> "$GITHUB_ENV"
      - name: Use the given package
        if: steps.source.outputs.pack != 'true'
        run: echo "SLIDE_NG_SOURCE=${{ steps.source.outputs.spec }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3
      - name: Build the image (load it, do not push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: slide-ng-docker:ci
          build-args: |
            SLIDE_NG_SOURCE=${{ env.SLIDE_NG_SOURCE }}

      # Smoke tests: the pieces the image promises are there. A full deck build and export are NOT run here.
      - name: Smoke test
        run: |
          docker run --rm slide-ng-docker:ci slide-ng --help
          docker run --rm slide-ng-docker:ci node --version
          docker run --rm slide-ng-docker:ci chromium --version
          docker run --rm slide-ng-docker:ci id -u
